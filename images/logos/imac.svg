<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <path id="topArc" d="M 30 100 A 70 70 0 0 1 170 100"/>
    <path id="botArc" d="M 34 100 A 66 66 0 0 0 166 100"/>
  </defs>
  <circle cx="100" cy="100" r="98" fill="#1B2A6B"/>
  <!-- gear teeth ring -->
  <g fill="#1B2A6B" stroke="#F4C430" stroke-width="1.5">
    <g id="teeth">
      <circle cx="100" cy="100" r="92" fill="none" stroke="#F4C430" stroke-width="2"/>
    </g>
  </g>
  <!-- cog notches -->
  <g fill="#F4C430">
    <circle cx="100" cy="12" r="3"/><circle cx="100" cy="188" r="3"/>
    <circle cx="12" cy="100" r="3"/><circle cx="188" cy="100" r="3"/>
    <circle cx="38" cy="38" r="3"/><circle cx="162" cy="38" r="3"/>
    <circle cx="38" cy="162" r="3"/><circle cx="162" cy="162" r="3"/>
  </g>
  <!-- outer text -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="100" cy="100" r="58" fill="#FFFFFF"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">INSTITUTE OF MANAGEMENT</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">AND COMPUTER SCIENCES</textPath>
  </text>
  <!-- inner emblem: sun rays + open book -->
  <circle cx="100" cy="86" r="18" fill="#1B2A6B"/>
  <g stroke="#F4C430" stroke-width="1.6" stroke-linecap="round">
    <path d="M100 62 L100 68"/><path d="M118 68 L114 73"/><path d="M82 68 L86 73"/>
    <path d="M124 86 L118 86"/><path d="M76 86 L82 86"/>
  </g>
  <circle cx="100" cy="86" r="9" fill="#F4C430"/>
  <!-- open book -->
  <g>
    <path d="M74 104 Q88 96 100 102 Q112 96 126 104 L126 116 Q112 108 100 114 Q88 108 74 116 Z" fill="#FFFFFF" stroke="#1B2A6B" stroke-width="1.6"/>
    <path d="M100 102 L100 114" stroke="#1B2A6B" stroke-width="1.6"/>
  </g>
  <text x="100" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#F4C430" letter-spacing="1">LAHORE</text>
  <text x="100" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" letter-spacing="1">PAKISTAN</text>
</svg>
